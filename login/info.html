<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>احــــرص</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    font-family:'Cairo',sans-serif;
    background:#05070b;
    color:#fff;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
}

body::before{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    background:#0755ff;
    opacity:.13;
    filter:blur(130px);
    border-radius:50%;
    top:-220px;
    right:-150px;
}

body::after{
    content:"";
    position:absolute;
    width:420px;
    height:420px;
    background:#0066ff;
    opacity:.08;
    filter:blur(130px);
    border-radius:50%;
    bottom:-220px;
    left:-150px;
}

.grid{
    position:absolute;
    inset:0;
    background-image:
        linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:45px 45px;
    mask-image:linear-gradient(to bottom,transparent,#000 25%,#000 75%,transparent);
}

.container{
    width:min(92%,620px);
    position:relative;
    z-index:2;
    text-align:center;
    animation:show .9s ease forwards;
}

.icon{
    width:76px;
    height:76px;
    margin:0 auto 28px;
    border:1px solid rgba(50,130,255,.35);
    border-radius:24px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(145deg,rgba(20,70,150,.25),rgba(5,10,20,.75));
    box-shadow:0 0 45px rgba(0,91,255,.12),inset 0 0 25px rgba(30,120,255,.05);
    position:relative;
}

.icon::before{
    content:"";
    position:absolute;
    inset:-7px;
    border-radius:30px;
    border:1px solid rgba(30,120,255,.08);
}

.icon svg{
    width:34px;
    height:34px;
    fill:none;
    stroke:#4d9aff;
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:7px 14px;
    border-radius:30px;
    background:rgba(20,90,190,.08);
    border:1px solid rgba(60,140,255,.15);
    color:#82b8ff;
    font-size:12px;
    font-weight:600;
    margin-bottom:18px;
}

.badge span{
    width:6px;
    height:6px;
    border-radius:50%;
    background:#4293ff;
    box-shadow:0 0 10px #4293ff;
    animation:pulse 1.5s infinite;
}

h1{
    font-size:clamp(25px,5vw,39px);
    line-height:1.5;
    font-weight:800;
    letter-spacing:-.8px;
    margin-bottom:16px;
    background:linear-gradient(120deg,#fff 15%,#c8dcff 50%,#559cff 90%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.description{
    color:#929aaa;
    font-size:clamp(13px,2vw,15px);
    line-height:2;
    max-width:500px;
    margin:0 auto 30px;
}

.timer-box{
    width:100%;
    max-width:400px;
    margin:auto;
    padding:18px 22px;
    border:1px solid rgba(255,255,255,.07);
    background:rgba(255,255,255,.025);
    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);
    border-radius:18px;
    box-shadow:0 20px 60px rgba(0,0,0,.2);
}

.timer-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    color:#70798a;
    font-size:11px;
    margin-bottom:12px;
}

.timer{
    color:#fff;
    font-size:25px;
    font-weight:700;
    direction:ltr;
    letter-spacing:1px;
}

.progress{
    width:100%;
    height:4px;
    background:rgba(255,255,255,.06);
    border-radius:10px;
    overflow:hidden;
}

.progress-bar{
    width:100%;
    height:100%;
    border-radius:10px;
    background:linear-gradient(90deg,#176cff,#64a9ff);
    transform-origin:right;
    animation:countdown 10s linear forwards;
    box-shadow:0 0 15px rgba(45,130,255,.5);
}

.note{
    margin-top:25px;
    color:#5e6674;
    font-size:11px;
}

@keyframes countdown{
    from{transform:scaleX(1)}
    to{transform:scaleX(0)}
}

@keyframes pulse{
    0%,100%{opacity:1;transform:scale(1)}
    50%{opacity:.4;transform:scale(.7)}
}

@keyframes show{
    from{opacity:0;transform:translateY(20px)}
    to{opacity:1;transform:translateY(0)}
}

@media(max-width:600px){
    body{
        padding:20px;
    }

    .container{
        width:100%;
    }

    .icon{
        width:68px;
        height:68px;
        border-radius:21px;
        margin-bottom:23px;
    }

    .icon svg{
        width:30px;
        height:30px;
    }

    .badge{
        font-size:10px;
        padding:6px 12px;
        margin-bottom:14px;
    }

    h1{
        font-size:24px;
        line-height:1.6;
        padding:0 8px;
    }

    .description{
        font-size:12px;
        line-height:2;
        padding:0 10px;
        margin-bottom:25px;
    }

    .timer-box{
        padding:16px;
        border-radius:16px;
    }

    .timer{
        font-size:22px;
    }

    .note{
        font-size:10px;
    }
}

@media(max-height:650px){
    .icon{
        margin-bottom:15px;
    }

    .badge{
        margin-bottom:10px;
    }

    h1{
        margin-bottom:8px;
    }

    .description{
        margin-bottom:15px;
    }

    .note{
        margin-top:12px;
    }
}
</style>
</head>

<body>

<div class="grid"></div>

<main class="container">
    <div class="icon">
        <svg viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="14" rx="2"></rect>
            <path d="M8 21h8"></path>
            <path d="M12 18v3"></path>
        </svg>
    </div>

    <div class="badge">
        <span></span>
        تجربة محسّنة قادمة
    </div>

    <h1>للحصول على أفضل تجربة<br>استخدم المنصة على سطح المكتب</h1>

    <p class="description">
        للحصول على أفضل نتيجة وأداء كامل، يُفضّل استخدام المنصة
        على جهاز الكمبيوتر أو تفعيل وضع سطح المكتب من متصفح هاتفك.
    </p>

    <div class="timer-box">
        <div class="timer-top">
            <span>سيتم الانتقال تلقائياً</span>
            <span class="timer" id="timer">00:10</span>
        </div>
        <div class="progress">
            <div class="progress-bar"></div>
        </div>
    </div>

    <div class="note">يتم تجهيز المنصة لك...</div>
</main>

<script>
let seconds = 10;
const timer = document.getElementById("timer");

const countdown = setInterval(() => {
    seconds--;

    timer.textContent = `00:${String(seconds).padStart(2, "0")}`;

    if (seconds <= 0) {
        clearInterval(countdown);
        window.location.href = "login.html";
    }
}, 1000);
</script>

</body>
</html>
